<script>
  const IS_CANVAS_PREVIEW = (typeof google === 'undefined' || !google.script || !google.script.run);
  
  let currentUser = null;
  let activeTargetInputId = null;
  let debounceTimer = null;

  // Pagination state
  const paginationState = {
    EDC: { page: 1, limit: 8, pages: 1 },
    SIM: { page: 1, limit: 8, pages: 1 },
    SAM: { page: 1, limit: 8, pages: 1 }
  };

  // Mock Database Memory untuk preview offline
  const canvasMock = {
    edc: [
      { ID_EDC: 'EDC-0001', Vendor: 'Verifone', Lokasi: 'Jakarta', Type_EDC: 'V2 Colour', SN: 'V1E0818495', IMEI: '866232050514084', Completeness: 'Complete', Condition: 'New', Status: 'Available', Foto_Drive_URL: '', Note: 'Ready Gudang Utama', Created_By: 'superuser' },
      { ID_EDC: 'EDC-0002', Vendor: 'Verifone', Lokasi: 'Bandung', Type_EDC: 'V4 Colour', SN: 'V1E0818496', IMEI: '866232050514085', Completeness: 'Complete', Condition: 'Good', Status: 'Backup', Foto_Drive_URL: '', Note: 'Persiapan Support', Created_By: 'admin' }
    ],
    sim: [
      { ID_SIM: 'SIM-0001', Provider: 'Telkomsel', ICCID_SN: '621000159010427600', Status: 'Available', Note: 'Stok Baru', Created_By: 'admin' }
    ],
    sam: [
      { ID_SAM: 'SAM-0001', Provider: 'SAM BRI', ICCID_SN: '8E9C', Status: 'Available', Note: 'Master Key Aktif', Created_By: 'superuser' }
    ]
  };

  document.addEventListener('DOMContentLoaded', function() {
    if (typeof lucide !== 'undefined') lucide.createIcons();
    if (IS_CANVAS_PREVIEW) {
      showToast('Running in Gemini Canvas Preview Mode', 'info');
    }
  });

  function showToast(message, type = 'success') {
    const container = document.getElementById('toast-container');
    if (!container) return;
    const toast = document.createElement('div');
    
    let bg = 'bg-slate-900 text-white';
    if (type === 'success') bg = 'bg-emerald-600 text-white';
    if (type === 'error') bg = 'bg-rose-600 text-white';
    if (type === 'info') bg = 'bg-blue-600 text-white';

    toast.className = bg + ' px-4 py-3 rounded-xl shadow-lg text-xs font-medium flex items-center justify-between transition-all duration-300 transform translate-y-2 opacity-0 pointer-events-auto';
    toast.innerHTML = '<span>' + message + '</span><button onclick="this.parentElement.remove()" class="ml-3 opacity-70 hover:opacity-100">&times;</button>';

    container.appendChild(toast);
    setTimeout(() => {
      toast.classList.remove('translate-y-2', 'opacity-0');
    }, 10);

    setTimeout(() => {
      toast.classList.add('opacity-0');
      setTimeout(() => toast.remove(), 300);
    }, 5000);
  }

  function quickFill(role) {
    const uInput = document.getElementById('login-username');
    const pInput = document.getElementById('login-password');
    if (role === 'superuser') { uInput.value = 'superuser'; pInput.value = 'admin123'; }
    if (role === 'admin') { uInput.value = 'admin'; pInput.value = 'admin123'; }
    if (role === 'engineer') { uInput.value = 'engineer'; pInput.value = 'eng123'; }
    if (role === 'customer') { uInput.value = 'customer'; pInput.value = 'cust123'; }
  }

  function handleLogin(e) {
    e.preventDefault();
    const u = document.getElementById('login-username').value.trim();
    const p = document.getElementById('login-password').value;
    const btn = document.getElementById('btn-login-submit');

    btn.disabled = true;
    btn.innerHTML = '<span>Memeriksa...</span>';

    if (IS_CANVAS_PREVIEW) {
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk Sistem</span>';
        currentUser = { username: u, role: u === 'customer' ? 'Customer' : 'Super User', name: u.toUpperCase() };
        postLoginSetup();
      }, 500);
      return;
    }

    google.script.run
      .withSuccessHandler(function(res) {
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk Sistem</span>';
        if (res.success) {
          currentUser = res.user;
          postLoginSetup();
        } else {
          showToast(res.message, 'error');
        }
      })
      .withFailureHandler(function(err) {
        btn.disabled = false;
        btn.innerHTML = '<span>Masuk Sistem</span>';
        showToast('Error Server: ' + err.message, 'error');
      })
      .loginUser(u, p);
  }

  function postLoginSetup() {
    document.getElementById('login-screen').classList.add('hidden');
    document.getElementById('main-app').classList.remove('hidden');

    document.getElementById('user-display-name').textContent = currentUser.name || currentUser.username;
    document.getElementById('user-display-role').textContent = currentUser.role;

    if (currentUser.role.toLowerCase() === 'customer') {
      const btnAddEdc = document.getElementById('btn-add-edc');
      const btnAddSim = document.getElementById('btn-add-sim');
      const btnAddSam = document.getElementById('btn-add-sam');
      if (btnAddEdc) btnAddEdc.classList.add('hidden');
      if (btnAddSim) btnAddSim.classList.add('hidden');
      if (btnAddSam) btnAddSam.classList.add('hidden');
    }

    loadDashboardData();
    fetchStockData('EDC', 1);
    fetchStockData('SIM', 1);
    fetchStockData('SAM', 1);
    showToast('Selamat datang, ' + currentUser.name, 'success');
  }

  function handleLogout() {
    currentUser = null;
    document.getElementById('main-app').classList.add('hidden');
    document.getElementById('login-screen').classList.remove('hidden');
    showToast('Berhasil keluar dari sistem', 'info');
  }

  function switchTab(tabName) {
    ['dashboard', 'edc', 'sim', 'sam'].forEach(t => {
      const btn = document.getElementById('tab-' + t);
      const view = document.getElementById('view-' + t);
      if (!btn || !view) return;
      if (t === tabName) {
        btn.className = 'px-4 py-2 rounded-xl font-medium text-sm transition flex items-center gap-2 bg-accent text-white shadow-sm';
        view.classList.remove('hidden');
      } else {
        btn.className = 'px-4 py-2 rounded-xl font-medium text-sm transition flex items-center gap-2 text-gray-600 hover:bg-white';
        view.classList.add('hidden');
      }
    });
  }

  function loadDashboardData() {
    if (IS_CANVAS_PREVIEW) {
      updateDashboardUI({
        edc: { total: canvasMock.edc.length, available: 1, backup: 1, penarikan: 0 },
        sim: { total: canvasMock.sim.length, available: 1, backup: 0, penarikan: 0 },
        sam: { total: canvasMock.sam.length, available: 1, backup: 0, penarikan: 0 }
      });
      return;
    }

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          updateDashboardUI(res.data);
        }
      })
      .getDashboardStats();
  }

  function updateDashboardUI(d) {
    document.getElementById('stat-edc-total').textContent = d.edc.total;
    document.getElementById('stat-edc-available').textContent = d.edc.available;
    document.getElementById('stat-edc-backup').textContent = d.edc.backup;
    document.getElementById('stat-edc-penarikan').textContent = d.edc.penarikan;

    document.getElementById('stat-sim-total').textContent = d.sim.total;
    document.getElementById('stat-sim-available').textContent = d.sim.available;
    document.getElementById('stat-sim-backup').textContent = d.sim.backup;
    document.getElementById('stat-sim-penarikan').textContent = d.sim.penarikan;

    document.getElementById('stat-sam-total').textContent = d.sam.total;
    document.getElementById('stat-sam-available').textContent = d.sam.available;
    document.getElementById('stat-sam-backup').textContent = d.sam.backup;
    document.getElementById('stat-sam-penarikan').textContent = d.sam.penarikan;
  }

  function debounceFetch(type) {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      fetchStockData(type, 1);
    }, 400);
  }

  function fetchStockData(type, page) {
    const sheetName = 'Stock_' + type;
    const searchVal = document.getElementById(type.toLowerCase() + '-search').value;
    const statusVal = document.getElementById(type.toLowerCase() + '-filter-status').value;
    const tableBody = document.getElementById('table-' + type.toLowerCase() + '-body');

    tableBody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-400">Memuat data ' + type + '...</td></tr>';

    if (IS_CANVAS_PREVIEW) {
      let list = canvasMock[type.toLowerCase()] || [];
      renderTableRows(type, list);
      renderPagination(type, 1, 1, list.length);
      return;
    }

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          paginationState[type].page = res.page;
          paginationState[type].pages = res.pages;
          renderTableRows(type, res.items);
          renderPagination(type, res.page, res.pages, res.total);
        } else {
          tableBody.innerHTML = '<tr><td colspan="7" class="p-4 text-center text-red-500">' + res.message + '</td></tr>';
        }
      })
      .getPaginatedStock(sheetName, page, paginationState[type].limit, searchVal, statusVal);
  }

  function renderTableRows(type, items) {
    const tbody = document.getElementById('table-' + type.toLowerCase() + '-body');
    if (!items || items.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" class="p-6 text-center text-gray-400">Data tidak ditemukan.</td></tr>';
      return;
    }

    let html = '';
    items.forEach(item => {
      const badgeClass = 'badge-' + (item.Status || 'available').toLowerCase();
      
      if (type === 'EDC') {
        const photoElem = item.Foto_Drive_URL 
          ? '<a href="' + item.Foto_Drive_URL + '" target="_blank" class="text-accent hover:underline flex items-center gap-1"><i data-lucide="image" class="w-3.5 h-3.5"></i> Lihat</a>'
          : '<span class="text-gray-300">-</span>';

        html += '<tr class="hover:bg-blue-50/30 transition">' +
          '<td class="p-3"><div class="font-bold text-gray-800">' + item.ID_EDC + '</div><div class="text-[10px] text-softtext">' + item.Vendor + '</div></td>' +
          '<td class="p-3"><div class="font-medium">' + item.Lokasi + '</div><div class="text-[10px] text-gray-500">' + item.Type_EDC + '</div></td>' +
          '<td class="p-3"><div class="font-mono text-xs">' + item.SN + '</div><div class="text-[10px] text-gray-400">IMEI: ' + item.IMEI + '</div></td>' +
          '<td class="p-3"><span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-gray-100">' + item.Completeness + '</span> <span class="px-2 py-0.5 rounded text-[10px] font-semibold bg-gray-100 ml-1">' + item.Condition + '</span></td>' +
          '<td class="p-3"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold ' + badgeClass + '">' + item.Status + '</span></td>' +
          '<td class="p-3">' + photoElem + '</td>' +
          '<td class="p-3">' + renderActionButtons('EDC', item.ID_EDC, item.Status) + '</td>' +
        '</tr>';
      } else if (type === 'SIM') {
        html += '<tr class="hover:bg-blue-50/30 transition">' +
          '<td class="p-3 font-bold text-gray-800">' + item.ID_SIM + '</td>' +
          '<td class="p-3 font-medium text-gray-700">' + item.Provider + '</td>' +
          '<td class="p-3 font-mono text-xs">' + item.ICCID_SN + '</td>' +
          '<td class="p-3"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold ' + badgeClass + '">' + item.Status + '</span></td>' +
          '<td class="p-3 text-gray-500">' + (item.Note || '-') + '</td>' +
          '<td class="p-3 text-gray-500 text-[11px]">' + item.Created_By + '</td>' +
          '<td class="p-3">' + renderActionButtons('SIM', item.ID_SIM, item.Status) + '</td>' +
        '</tr>';
      } else if (type === 'SAM') {
        html += '<tr class="hover:bg-blue-50/30 transition">' +
          '<td class="p-3 font-bold text-gray-800">' + item.ID_SAM + '</td>' +
          '<td class="p-3 font-medium text-gray-700">' + item.Provider + '</td>' +
          '<td class="p-3 font-mono text-xs">' + item.ICCID_SN + '</td>' +
          '<td class="p-3"><span class="px-2.5 py-1 rounded-full text-[10px] font-bold ' + badgeClass + '">' + item.Status + '</span></td>' +
          '<td class="p-3 text-gray-500">' + (item.Note || '-') + '</td>' +
          '<td class="p-3 text-gray-500 text-[11px]">' + item.Created_By + '</td>' +
          '<td class="p-3">' + renderActionButtons('SAM', item.ID_SAM, item.Status) + '</td>' +
        '</tr>';
      }
    });

    tbody.innerHTML = html;
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function renderActionButtons(type, id, currentStatus) {
    if (currentUser && currentUser.role.toLowerCase() === 'customer') {
      return '<span class="text-gray-400 text-[10px]">Read Only</span>';
    }
    return '<select onchange="changeStatus(\'' + type + '\', \'' + id + '\', this.value)" class="neu-input text-[10px] px-2 py-1 bg-white">' +
      '<option value="">Ubah Status...</option>' +
      '<option value="Available">Available</option>' +
      '<option value="Backup">Backup</option>' +
      '<option value="Penarikan">Penarikan</option>' +
    '</select>';
  }

  function renderPagination(type, page, totalPages, totalItems) {
    const el = document.getElementById(type.toLowerCase() + '-pagination');
    if (!el) return;
    const prevDisabled = page <= 1 ? 'disabled' : '';
    const nextDisabled = page >= totalPages ? 'disabled' : '';

    el.innerHTML = '<span>Total: ' + totalItems + ' items (Hal ' + page + ' dari ' + totalPages + ')</span>' +
      '<div class="flex gap-1">' +
        '<button onclick="fetchStockData(\'' + type + '\', ' + (page - 1) + ')" ' + prevDisabled + ' class="px-3 py-1 rounded neu-card hover:bg-gray-50 text-xs disabled:opacity-40">Prev</button>' +
        '<button onclick="fetchStockData(\'' + type + '\', ' + (page + 1) + ')" ' + nextDisabled + ' class="px-3 py-1 rounded neu-card hover:bg-gray-50 text-xs disabled:opacity-40">Next</button>' +
      '</div>';
  }

  function changeStatus(type, id, newStatus) {
    if (!newStatus) return;

    if (IS_CANVAS_PREVIEW) {
      const item = (canvasMock[type.toLowerCase()] || []).find(x => (x['ID_' + type] === id));
      if (item) item.Status = newStatus;
      showToast('Status ' + id + ' diperbarui ke ' + newStatus + ' (Optimistic)', 'success');
      fetchStockData(type, paginationState[type].page);
      loadDashboardData();
      return;
    }

    showToast('Memproses update status ' + id + '...', 'info');

    google.script.run
      .withSuccessHandler(res => {
        if (res.success) {
          showToast(res.message, 'success');
          fetchStockData(type, paginationState[type].page);
          loadDashboardData();
        } else {
          showToast(res.message, 'error');
        }
      })
      .updateStockStatus(type, id, newStatus, currentUser ? currentUser.username : 'User');
  }

  function openModalEDC() { document.getElementById('modal-edc').classList.remove('hidden'); }
  function openModalSIM() { document.getElementById('modal-sim').classList.remove('hidden'); }
  function openModalSAM() { document.getElementById('modal-sam').classList.remove('hidden'); }

  function closeModal(modalId) {
    document.getElementById(modalId).classList.add('hidden');
  }

  function previewSelectedPhoto(input) {
    if (input.files && input.files[0]) {
      const reader = new FileReader();
      reader.onload = function(e) {
        document.getElementById('edc-foto-base64').value = e.target.result;
        document.getElementById('edc-foto-preview-img').src = e.target.result;
        document.getElementById('edc-foto-preview-box').classList.remove('hidden');
      };
      reader.readAsDataURL(input.files[0]);
    }
  }

  function submitStockEDC(e) {
    e.preventDefault();
    const payload = {
      lokasi: document.getElementById('edc-lokasi').value,
      typeEDC: document.getElementById('edc-type').value,
      sn: document.getElementById('edc-sn').value.trim(),
      imei: document.getElementById('edc-imei').value.trim(),
      completeness: document.getElementById('edc-completeness').value,
      condition: document.getElementById('edc-condition').value,
      status: document.getElementById('edc-status').value,
      fotoBase64: document.getElementById('edc-foto-base64').value,
      note: document.getElementById('edc-note').value.trim()
    };

    const btn = document.getElementById('btn-save-edc');
    btn.disabled = true;
    btn.innerHTML = '<span>Menyimpan...</span>';

    if (IS_CANVAS_PREVIEW) {
      setTimeout(() => {
        btn.disabled = false;
        btn.innerHTML = '<span>Simpan Stock EDC</span>';
        canvasMock.edc.unshift({
          ID_EDC: 'EDC-000' + (canvasMock.edc.length + 1),
          Vendor: 'Verifone',
          Lokasi: payload.lokasi,
          Type_EDC: payload.typeEDC,
          SN: payload.sn,
          IMEI: payload.imei,
          Completeness: payload.completeness,
          Condition: payload.condition,
          Status: payload.status,
          Foto_Drive_URL: payload.fotoBase64,
          Note: payload.note,
          Created_By: currentUser ? currentUser.username : 'superuser'
        });
        closeModal('modal-edc');
        document.getElementById('form-add-edc').reset();
        document.getElementById('edc-foto-preview-box').classList.add('hidden');
        showToast('Stock EDC berhasil disimpan (Optimistic UI)', 'success');
        fetchStockData('EDC', 1);
        loadDashboardData();
      }, 500);
      return;
    }

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        btn.innerHTML = '<span>Simpan Stock EDC</span>';
        if (res.success) {
          closeModal('modal-edc');
          document.getElementById('form-add-edc').reset();
          document.getElementById('edc-foto-preview-box').classList.add('hidden');
          showToast(res.message, 'success');
          fetchStockData('EDC', 1);
          loadDashboardData();
        } else {
          showToast(res.message, 'error');
        }
      })
      .saveStockEDC(payload, currentUser ? currentUser.username : 'User');
  }

    const btn = document.getElementById('btn-save-sim');

        ICCID_SN: payload.iccidSN,

        Note: payload.note,
        Created_By: currentUser ? currentUser.username : 'admin'
      });
      closeModal('modal-sim');
      document.getElementById('form-add-sim').reset();
      showToast('Stock SIM Card berhasil disimpan', 'success');
      fetchStockData('SIM', 1);
      loadDashboardData();

    }

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        if (res.success) {
          closeModal('modal-sim');
          document.getElementById('form-add-sim').reset();
          showToast(res.message, 'success');
          fetchStockData('SIM', 1);
          loadDashboardData();
        } else {
          showToast(res.message, 'error');

      })

    e.preventDefault();

    const btn = document.getElementById('btn-save-sam');

    if (IS_CANVAS_PREVIEW) {
      btn.disabled = false;

        Provider: 'SAM BRI',
        ICCID_SN: payload.iccidSN,
        Status: payload.status,
        Note: payload.note,
        Created_By: currentUser ? currentUser.username : 'superuser'
      });
      closeModal('modal-sam');
      document.getElementById('form-add-sam').reset();
      showToast('Stock SAM Card berhasil disimpan', 'success');
      fetchStockData('SAM', 1);
      loadDashboardData();
      return;
    }

    google.script.run
      .withSuccessHandler(res => {
        btn.disabled = false;
        if (res.success) {
          closeModal('modal-sam');
          document.getElementById('form-add-sam').reset();
          showToast(res.message, 'success');
          fetchStockData('SAM', 1);
          loadDashboardData();
        } else {
          showToast(res.message, 'error');
        }
      })
      .saveStockSAM(payload, currentUser ? currentUser.username : 'User');
  }

  function exportStockExcel(type) {
    showToast('Menyiapkan file Excel ' + type + '...', 'info');
    
    if (IS_CANVAS_PREVIEW) {
      const list = canvasMock[type.toLowerCase()] || [];
      generateCsvDownload(type, list);
      return;
    }

    google.script.run
      .withSuccessHandler(res => {
        if (res.success && res.items) {
          generateCsvDownload(type, res.items);
        } else {
          showToast('Gagal mengambil data untuk export Excel', 'error');
        }
      })
      .getPaginatedStock('Stock_' + type, 1, 10000, '', 'all');
  }

  function generateCsvDownload(type, items) {
    if (!items || items.length === 0) {
      showToast('Tidak ada data stok ' + type + ' untuk di-export', 'error');
      return;
    }

    const keys = Object.keys(items[0]);
    let csvContent = '\uFEFF';
    csvContent += keys.join(',') + '\n';

    items.forEach(item => {
      const row = keys.map(k => {
        let val = item[k] || '';
        val = val.toString().replace(/"/g, '""');
        if (val.includes(',') || val.includes('\n') || val.includes('"')) {
          val = '"' + val + '"';
        }
        return val;
      });
      csvContent += row.join(',') + '\n';
    });

    const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.setAttribute('href', url);
    link.setAttribute('download', 'Laporan_Stock_' + type + '_' + new Date().toISOString().slice(0,10) + '.csv');
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    showToast('Berhasil mengunduh laporan Excel ' + type, 'success');
  }

  function exportStockPDF(type) {
    showToast('Menyiapkan dokumen PDF ' + type + '...', 'info');

    if (IS_CANVAS_PREVIEW) {
      const list = canvasMock[type.toLowerCase()] || [];
      generatePdfReportWindow(type, list);
      return;
    }

    google.script.run
      .withSuccessHandler(res => {
        if (res.success && res.items) {
          generatePdfReportWindow(type, res.items);
        } else {
          showToast('Gagal mengambil data untuk export PDF', 'error');
        }
      })
      .getPaginatedStock('Stock_' + type, 1, 10000, '', 'all');
  }

  function generatePdfReportWindow(type, items) {
    if (!items || items.length === 0) {
      showToast('Tidak ada data stok ' + type + ' untuk di-export', 'error');
      return;
    }

    const printWin = window.open('', '_blank');
    if (!printWin) {
      showToast('Pop-up terblokir! Izinkan pop-up browser Anda.', 'error');
      return;
    }

    const keys = Object.keys(items[0]);
    let tableHeaders = keys.map(k => '<th style="border:1px solid #cbd5e1; padding:8px; background:#f1f5f9; text-align:left; font-size:11px;">' + k + '</th>').join('');
    let tableRows = items.map(item => {
      let tds = keys.map(k => '<td style="border:1px solid #e2e8f0; padding:6px 8px; font-size:11px;">' + (item[k] || '-') + '</td>').join('');
      return '<tr>' + tds + '</tr>';
    }).join('');

    const nowStr = new Date().toLocaleString('id-ID');

    const htmlDoc = `<!DOCTYPE html>
<html>
<head>
  <title>Laporan Stock ${type} - GCS Inventory</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 24px; color: #1e293b; background: #fff; }
    .header { border-bottom: 2px solid #0088ff; padding-bottom: 12px; margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .title { font-size: 18px; font-weight: bold; color: #0f172a; }
    .subtitle { font-size: 12px; color: #64748b; margin-top: 2px; }
    table { width: 100%; border-collapse: collapse; margin-top: 15px; }
    @media print {
      body { padding: 0; }
      @page { size: A4 landscape; margin: 12mm; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <div class="title">GCS STOCK INVENTORY SYSTEM</div>
      <div class="subtitle">Laporan Resmi Opname Stok ${type}</div>
    </div>
    <div style="text-align:right;">
      <div style="font-size:11px; font-weight:bold;">Dicetak: ${nowStr}</div>
      <div style="font-size:10px; color:#64748b;">Total: ${items.length} Item</div>
    </div>
  </div>
  <table>
    <thead><tr>${tableHeaders}</tr></thead>
    <tbody>${tableRows}</tbody>

    window.onload = function() {

      }, 300);

    printWin.document.write(htmlDoc);
    printWin.document.close();
    showToast('Jendela Laporan PDF ' + type + ' dibuka', 'success');
  }

  function openAiLensModalForInput(targetInputId) {
    activeTargetInputId = targetInputId;
    const modal = document.getElementById('aiLensModal');
    if (modal) {
      modal.classList.remove('hidden');
    }
    resetAiLensModal();
  }

  function startCameraScanner(targetInputId) {
    openAiLensModalForInput(targetInputId);
  }

  function closeAiLensModal() {
    const modal = document.getElementById('aiLensModal');
    if (modal) {
      modal.classList.add('hidden');
    }
    resetAiLensModal();
  }

  function stopCameraScanner() {
    closeAiLensModal();
  }

  function resetAiLensModal() {
    const uploadArea = document.getElementById('aiLensUploadArea');
    const loadingCon = document.getElementById('aiLensLoading');
    const resultCon = document.getElementById('aiLensResultView');
    const fileInput = document.getElementById('aiLensInputFile');
    const cameraInput = document.getElementById('aiLensCameraFile');

    if (uploadArea) {
      uploadArea.classList.remove('hidden');
      uploadArea.classList.add('flex');
    }
    if (loadingCon) {
      loadingCon.classList.add('hidden');
      loadingCon.classList.remove('flex');
    }
    if (resultCon) {
      resultCon.classList.add('hidden');
      resultCon.classList.remove('flex');
    }
    if (fileInput) fileInput.value = '';
    if (cameraInput) cameraInput.value = '';
    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function processAiLensImage(inputElement) {
    if (!inputElement || !inputElement.files || inputElement.files.length === 0) return;
    const file = inputElement.files[0];

    const uploadArea = document.getElementById('aiLensUploadArea');
    const loadingCon = document.getElementById('aiLensLoading');
    const resultCon = document.getElementById('aiLensResultView');

    if (uploadArea) {
      uploadArea.classList.add('hidden');
      uploadArea.classList.remove('flex');
    }
    if (resultCon) {
      resultCon.classList.add('hidden');
      resultCon.classList.remove('flex');
    }
    if (loadingCon) {
      loadingCon.classList.remove('hidden');
      loadingCon.classList.add('flex');
      
      const loadingTitle = loadingCon.querySelector('p:nth-child(2)');
      const loadingSubtitle = loadingCon.querySelector('p:nth-child(3)');
      if (loadingTitle) loadingTitle.textContent = 'Membaca barcode & teks stiker...';
      if (loadingSubtitle) loadingSubtitle.textContent = 'Memindai langsung di browser pengguna...';
    }

    const reader = new FileReader();
    reader.onload = function(e) {
      const img = new Image();
      img.onload = async function() {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        const maxDim = 1400;

        if (width > maxDim || height > maxDim) {
          if (width > height) {
            height = Math.round((height * maxDim) / width);
            width = maxDim;
          } else {
            width = Math.round((width * maxDim) / height);
            height = maxDim;
          }
        }

        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);

        await executeLocalOcrAndBarcode(canvas, file);
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  }

  async function executeLocalOcrAndBarcode(canvas, file) {
    let detectedBarcodes = [];
    let detectedOcrText = '';

    // 1. Deteksi Barcode Fisik (Barcode 1D Code128 / Code39 pada stiker Verifone)
    if ('BarcodeDetector' in window) {
      try {
        const supportedFormats = await BarcodeDetector.getSupportedFormats();
        const barcodeDetector = new BarcodeDetector({ formats: supportedFormats });
        const barcodes = await barcodeDetector.detect(canvas);
        if (barcodes && barcodes.length > 0) {
          barcodes.forEach(b => {
            if (b.rawValue && b.rawValue.trim()) {
              detectedBarcodes.push(b.rawValue.trim());
            }
          });
        }
      } catch (err) {
        console.warn('BarcodeDetector Native:', err);
      }
    }

    // 2. Deteksi Karakter Fisik Teks via Tesseract.js (Client-side)
    if (typeof Tesseract !== 'undefined') {
      try {
        const loadingSubtitle = document.querySelector('#aiLensLoading p:nth-child(3)');
        const ocrResult = await Tesseract.recognize(canvas, 'eng', {
          logger: m => {
            if (loadingSubtitle && m.status === 'recognizing text') {
              const pct = Math.round((m.progress || 0) * 100);
              loadingSubtitle.textContent = 'Membaca label stiker (' + pct + '%)...';
            }
          }
        });

        if (ocrResult && ocrResult.data && ocrResult.data.text) {
          detectedOcrText = ocrResult.data.text.trim();
        }
      } catch (err) {
        console.warn('Tesseract OCR Client:', err);
      }
    }

    // 3. Susun teks terdeteksi & hilangkan noise (BT MAC, WIFI MAC, MADE IN CHINA)
    let finalFormattedResult = formatExtractedContent(detectedBarcodes, detectedOcrText);

    if (!finalFormattedResult || finalFormattedResult.trim() === '') {
      finalFormattedResult = "Foto belum terbaca jelas.\nPastikan stiker fokus, pencahayaan terang, dan posisi tegak.";
    }

    showAiLensResult(finalFormattedResult);
  }

  function formatExtractedContent(barcodes, ocrText) {
    let resultLines = [];
    const target = (activeTargetInputId || '').toLowerCase();

    // Prioritaskan Barcode yang terbaca
    if (barcodes && barcodes.length > 0) {
      barcodes.forEach(code => {
        const clean = code.trim();
        if (/^\d{14,16}$/.test(clean)) {
          if (!resultLines.some(l => l.includes(clean))) {
            resultLines.push("IMEI1: " + clean);
          }
        } else if (/^[A-Z0-9]{8,15}$/i.test(clean)) {
          if (!resultLines.some(l => l.includes(clean))) {
            resultLines.unshift("S/N: " + clean);
          }
        }
      });
    }

    // Parsing baris teks hasil OCR
    if (ocrText && ocrText.trim()) {
      const rawLines = ocrText.split('\n');
      rawLines.forEach(l => {
        const trimmed = l.trim();
        if (!trimmed || trimmed.length < 3) return;

        // Eliminasi teks yang tidak diperlukan
        if (/MAC[:\s]/i.test(trimmed) || /MADE IN/i.test(trimmed)) return;

        if (/^(S\/N|SN|SERIAL)/i.test(trimmed)) {
          if (!resultLines.some(x => x.startsWith('S/N:'))) {
            const cleanVal = trimmed.replace(/^(S\/N|SN|SERIAL)[:\s\-]*/i, '').trim();
            resultLines.unshift("S/N: " + cleanVal);
          }
        } else if (/^IMEI1?[:\s]/i.test(trimmed)) {
          if (!resultLines.some(x => x.startsWith('IMEI1:'))) {
            const cleanVal = trimmed.replace(/^IMEI1?[:\s\-]*/i, '').trim();
            resultLines.push("IMEI1: " + cleanVal);
          }
        } else if (/^IMEI2[:\s]/i.test(trimmed)) {
          if (!resultLines.some(x => x.startsWith('IMEI2:'))) {
            const cleanVal = trimmed.replace(/^IMEI2[:\s\-]*/i, '').trim();
            resultLines.push("IMEI2: " + cleanVal);
          }
        } else if (target.includes('sim') && /^\d{10,20}$/.test(trimmed.replace(/\s+/g, ''))) {
          resultLines.push("ICCID: " + trimmed.replace(/\s+/g, ''));
        } else if (target.includes('sam') && /^[A-Z0-9]{3,12}$/i.test(trimmed)) {
          resultLines.push("SAM: " + trimmed);
        }
      });
    }

    // Jika target kartu SIM bertumpuk secara vertikal
    if (target.includes('sim') && ocrText && resultLines.length === 0) {
      let numericBlock = '';
      const lines = ocrText.split('\n');
      lines.forEach(l => {
        const digits = l.replace(/\D/g, '');
        if (digits.length >= 2) numericBlock += digits;
      });
      if (numericBlock.length >= 10) {
        resultLines.push("ICCID: " + numericBlock);
      }
    }

    return resultLines.join('\n');
  }

  function showAiLensResult(extractedText) {
    const loadingCon = document.getElementById('aiLensLoading');
    if (loadingCon) {
      loadingCon.classList.add('hidden');
      loadingCon.classList.remove('flex');
    }
    
    const resultCon = document.getElementById('aiLensResultView');
    if (resultCon) {
      resultCon.classList.remove('hidden');
      resultCon.classList.add('flex');
    }

    const textarea = document.getElementById('aiLensExtractedText');
    if (textarea) {
      textarea.value = extractedText;
    }

    if (typeof lucide !== 'undefined') lucide.createIcons();
  }

  function parseStickerData(text) {
    let sn = '';
    let imei1 = '';
    let imei2 = '';
    let iccid = '';
    let sam = '';

    const lines = text.split('\n').map(l => l.trim()).filter(Boolean);

    for (let line of lines) {
      // Abaikan baris MAC address dan Made In China
      if (/MAC[:\s]/i.test(line) || /MADE IN/i.test(line)) continue;

      // 1. Ekstrak Serial Number (S/N)
      if (/^(S\/N|SN|SERIAL)[:\s\-]*/i.test(line)) {
        let val = line.replace(/^(S\/N|SN|SERIAL)[:\s\-]*/i, '').trim();
        val = val.split(/\s+/)[0];
        if (val && !sn) sn = val;
      }

      // 2. Ekstrak IMEI1
      if (/^IMEI1[:\s\-]*/i.test(line)) {
        let val = line.replace(/^IMEI1[:\s\-]*/i, '').trim().split(/\s+/)[0];
        let digits = val.replace(/\D/g, '');
        if (digits.length >= 14 && digits.length <= 16) imei1 = digits;
      }

      // 3. Ekstrak IMEI Umum atau IMEI2
      if (/^IMEI[:\s\-]*/i.test(line) && !imei1) {
        let val = line.replace(/^IMEI[:\s\-]*/i, '').trim().split(/\s+/)[0];
        let digits = val.replace(/\D/g, '');
        if (digits.length >= 14 && digits.length <= 16) imei1 = digits;
      }
      if (/^IMEI2[:\s\-]*/i.test(line)) {
        let val = line.replace(/^IMEI2[:\s\-]*/i, '').trim().split(/\s+/)[0];
        let digits = val.replace(/\D/g, '');
        if (digits.length >= 14 && digits.length <= 16) imei2 = digits;
      }

      // 4. Ekstrak ICCID (SIM Card)
      if (/^ICCID[:\s\-]*/i.test(line)) {
        let val = line.replace(/^ICCID[:\s\-]*/i, '').trim().replace(/\D/g, '');
        if (val.length >= 8 && !iccid) iccid = val;
      }

      // 5. Ekstrak SAM Card
      if (/^SAM[:\s\-]*/i.test(line)) {
        let val = line.replace(/^SAM[:\s\-]*/i, '').trim().split(/\s+/)[0];
        if (val && !sam) sam = val;
      }
    }

    // Fallback pencarian S/N jika tidak ada prefix eksplisit
    if (!sn) {
      for (let line of lines) {
        if (/MAC|CHINA|IMEI|ICCID/i.test(line)) continue;
        let match = line.match(/\b([A-Z0-9]{8,14})\b/i);
        if (match && !/^\d{14,16}$/.test(match[1])) {
          sn = match[1];
          break;
        }
      }
    }

    // Fallback pencarian IMEI (15 digit angka)
    if (!imei1) {
      for (let line of lines) {
        if (/MAC/i.test(line)) continue;
        let digits = line.replace(/\D/g, '');
        if (digits.length >= 14 && digits.length <= 16) {
          imei1 = digits;
          break;
        }
      }
    }

    return { sn, imei: imei1 || imei2, iccid, sam };
  }

  function applyExtractedText() {
    const textarea = document.getElementById('aiLensExtractedText');
    if (!textarea || !activeTargetInputId) return;

    const fullText = textarea.value.trim();
    const targetLower = activeTargetInputId.toLowerCase();
    const parsed = parseStickerData(fullText);

    // KONDISI KHUSUS FORM EDC: Otomatis isi kedua kolom (SN dan IMEI) sekaligus
    if (targetLower.includes('edc')) {
      const snInput = document.getElementById('edc-sn');
      const imeiInput = document.getElementById('edc-imei');
      let filledFields = [];

      if (parsed.sn && snInput) {
        snInput.value = parsed.sn;
        filledFields.push('SN: ' + parsed.sn);
      }
      if (parsed.imei && imeiInput) {
        imeiInput.value = parsed.imei;
        filledFields.push('IMEI: ' + parsed.imei);
      }

      if (filledFields.length > 0) {
        closeAiLensModal();
        showToast('Berhasil mengisi ' + filledFields.join(' & '), 'success');
        return;
      }
    }

    // KONDISI FORM SIM CARD
    if (targetLower.includes('sim')) {
      const simInput = document.getElementById(activeTargetInputId);
      if (simInput) {
        const val = parsed.iccid || parsed.sn || fullText.replace(/\D/g, '');
        simInput.value = val;
        closeAiLensModal();
        showToast('ICCID SIM Card berhasil dimasukkan: ' + val, 'success');
        return;
      }
    }

    // KONDISI FORM SAM CARD
    if (targetLower.includes('sam')) {
      const samInput = document.getElementById(activeTargetInputId);
      if (samInput) {
        let val = parsed.sam || parsed.sn || fullText;
        val = val.replace(/^(SAM|ICCID|S\/N)[:\s\-]*/i, '').trim().split(/\s+/)[0];
        samInput.value = val;
        closeAiLensModal();
        showToast('SN SAM Card berhasil dimasukkan: ' + val, 'success');
        return;
      }
    }

    // FALLBACK: Masukkan ke input tunggal yang aktif
    const activeInput = document.getElementById(activeTargetInputId);
    if (activeInput) {
      let finalVal = targetLower.includes('imei') ? parsed.imei : parsed.sn;
      if (!finalVal) {
        finalVal = fullText.split('\n')[0].replace(/^[^:]*:\s*/, '').trim().split(/\s+/)[0];
      }
      activeInput.value = finalVal;
      closeAiLensModal();
      showToast('Nilai berhasil dimasukkan: ' + finalVal, 'success');
    }
  }
</script>
